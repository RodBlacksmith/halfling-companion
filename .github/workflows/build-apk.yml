
name: Build Halfling Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o halfling-overlay-android-source.zip

        
      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("halfling-overlay-android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    defaultConfig {',
              '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {'''
          )
          p.write_text(s)
          PY

          
      - name: Allow remote model loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("halfling-overlay-android/app/src/main/java/com/dalvenor/halfling/OverlayService.kt")
          s = p.read_text()
          old = "web.settings.allowFileAccess = true"
          new = old + """
                  web.settings.allowUniversalAccessFromFileURLs = true
                  web.settings.allowFileAccessFromFileURLs = true"""
          if old not in s:
              raise SystemExit("WebView settings line not found")
          p.write_text(s.replace(old, new, 1))
          PY
          

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: halfling-overlay-android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: halfling-companion-apk
          path: halfling-overlay-android/app/build/outputs/apk/debug/app-debug.apk
